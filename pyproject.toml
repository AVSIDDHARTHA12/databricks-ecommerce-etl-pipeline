[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-delta-etl"
version = "1.0.0"
description = "A Databricks and Delta Lake batch e-commerce ETL demo"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["ecommerce_etl*"]
